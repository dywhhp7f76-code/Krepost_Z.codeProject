<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Крепость</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Левая колонка: как список чатов в Telegram -->
    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="brand-row">
          <span class="brand">Крепость</span>
          <div class="brand-actions">
            <button type="button" class="icon-btn" id="btnSettings" title="Настройки" aria-label="Настройки">⚙</button>
            <button type="button" class="icon-btn" id="btnNew" title="Новый агент" aria-label="Новый агент">+</button>
          </div>
        </div>
        <label class="search-wrap">
          <input type="search" id="search" placeholder="Поиск агентов" autocomplete="off" />
        </label>
      </header>
      <div class="agent-list" id="agentList" role="list"></div>
      <footer class="sidebar-foot">
        <span id="hubStatus" class="hub-status">загрузка…</span>
        <button type="button" class="ghost tiny" id="btnSettingsFoot" title="Настройки">Настройки</button>
      </footer>
    </aside>

    <!-- Правая колонка: чат -->
    <section class="dialog">
      <div class="empty" id="emptyState">
        <p class="empty-brand">Крепость</p>
        <p class="empty-text">Выбери агента слева. Адреса API и боевого чата — кнопка ⚙ сверху.</p>
        <button type="button" class="ghost" id="btnEmptySettings">⚙ Настройки</button>
      </div>

      <div class="dialog-active hidden" id="dialogActive">
        <header class="dialog-head">
          <div class="dialog-peer">
            <div class="avatar" id="peerAvatar">К</div>
            <div>
              <div class="peer-name" id="peerName">—</div>
              <div class="peer-status" id="peerStatus">…</div>
            </div>
          </div>
          <div class="dialog-actions">
            <div class="mode" role="group" aria-label="Режим">
              <button type="button" class="mode-btn" data-mode="agent">Агент</button>
              <button type="button" class="mode-btn" data-mode="query">Быстрый</button>
            </div>
            <button type="button" class="text-btn" id="btnEdit" title="Настройки агента">⋯</button>
          </div>
        </header>

        <main class="messages" id="messages" aria-live="polite"></main>

        <footer class="composer">
          <form id="form" autocomplete="off">
            <textarea id="input" rows="1" placeholder="Сообщение" maxlength="32000" required></textarea>
            <button type="submit" class="send" id="send" aria-label="Отправить">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3.4 20.6 21 12 3.4 3.4l-.1 7.2L14 12l-10.7 1.4z"/></svg>
            </button>
          </form>
        </footer>
      </div>
    </section>
  </div>

  <!-- Модалка: новый / редактировать агента -->
  <dialog id="agentModal" class="modal">
    <form method="dialog" id="agentForm" class="modal-card">
      <h2 id="modalTitle">Новый агент</h2>
      <input type="hidden" id="fId" />
      <label>Имя
        <input id="fName" required maxlength="80" placeholder="Например: Крепость Studio" />
      </label>
      <label>URL API
        <input id="fUrl" required maxlength="300" placeholder="http://10.0.0.1:8000" />
      </label>
      <label>Подпись
        <input id="fSubtitle" maxlength="120" placeholder="коротко в списке" />
      </label>
      <label>Режим по умолчанию
        <select id="fMode">
          <option value="agent">Агент (/v1/agent)</option>
          <option value="query">Быстрый (/v1/query)</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost danger hidden" id="btnDelete">Удалить</button>
        <div class="spacer"></div>
        <button type="button" class="ghost" id="btnCancel">Отмена</button>
        <button type="submit" class="primary" id="btnSave">Сохранить</button>
      </div>
    </form>
  </dialog>

  <!-- Настройки хаба -->
  <dialog id="settingsModal" class="modal">
    <form method="dialog" id="settingsForm" class="modal-card settings-card">
      <h2>Настройки</h2>
      <p class="settings-lead">Сюда пишешь адреса Крепости — как в боевом чате.</p>

      <label>Куда ходить за ответами
        <select id="sTarget">
          <option value="studio">Боевой API (LAN / Studio)</option>
          <option value="local">Этот Mac (localhost)</option>
          <option value="custom">Свой адрес</option>
        </select>
      </label>

      <label>URL API
        <input id="sApi" required maxlength="300" placeholder="http://10.0.0.1:8000" />
      </label>

      <label>URL боевого чата (UI)
        <input id="sChat" required maxlength="300" placeholder="http://10.0.0.1:8000/chat" />
      </label>

      <label>URL localhost (если чат на этой машине)
        <input id="sLocal" maxlength="300" placeholder="http://127.0.0.1:8000" />
      </label>

      <label class="check">
        <input type="checkbox" id="sApplyAll" checked />
        Применить ко всем агентам в списке
      </label>

      <p class="settings-status" id="sStatus">—</p>

      <div class="modal-actions wrap">
        <button type="button" class="ghost" id="btnTestApi">Проверить связь</button>
        <button type="button" class="ghost" id="btnOpenCombat">Открыть /chat</button>
        <button type="button" class="ghost" id="btnResetAgents">7 агентов</button>
        <div class="spacer"></div>
        <button type="button" class="ghost" id="btnSettingsCancel">Отмена</button>
        <button type="submit" class="primary" id="btnSettingsSave">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
