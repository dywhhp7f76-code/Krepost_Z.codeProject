<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Личные чаты</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1410;
      --ink: #e7efe6;
      --muted: #8fa08c;
      --accent: #7cb87c;
      --accent2: #c9a66b;
      --line: rgba(124,184,124,.22);
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font); color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(124,184,124,.14), transparent 55%),
        linear-gradient(160deg, #0c100c, var(--bg));
      display: flex; flex-direction: column;
    }
    header {
      display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
      padding: .7rem 1rem; border-bottom: 1px solid var(--line);
      background: rgba(15,20,16,.9); backdrop-filter: blur(8px);
    }
    h1 {
      font-family: var(--display); font-size: 1.25rem; margin: 0 .5rem 0 0;
      font-weight: 700;
    }
    h1 span { color: var(--accent); }
    .chip {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: .4rem .85rem; font: inherit; cursor: pointer;
    }
    .chip.on { background: var(--accent); color: #0f1410; font-weight: 700; border-color: var(--accent); }
    .chip.ext { border-color: rgba(201,166,107,.4); color: var(--accent2); }
    .hint { color: var(--muted); font-size: .8rem; margin-left: auto; }
    main { flex: 1; min-height: 0; position: relative; }
    iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #0a0e0a;
    }
    .fallback {
      display: none; position: absolute; inset: 0;
      place-content: center; text-align: center; padding: 2rem; gap: 1rem;
    }
    .fallback.show { display: grid; }
    .fallback a {
      color: #0f1410; background: var(--accent2); text-decoration: none;
      font-weight: 700; padding: .85rem 1.2rem; border-radius: 12px;
    }
    .fallback p { color: var(--muted); max-width: 28rem; margin: 0 auto; }
  </style>
</head>
<body>
  <header>
    <h1>Личные <span>чаты</span></h1>
    <button class="chip on" data-src="http://10.0.0.1:8000/chat" data-id="krepost">Крепость</button>
    <button class="chip" data-src="/" data-id="agents">Obsidian Agents</button>
    <button class="chip ext" type="button" id="openClaude">Claude ↗</button>
    <button class="chip ext" type="button" id="openAll">Все вкладками ↗</button>
    <span class="hint" id="hint">группа Safari · Личный</span>
  </header>
  <main>
    <iframe id="frame" title="chat" src="http://10.0.0.1:8000/chat"></iframe>
    <div class="fallback" id="fallback">
      <p>Этот чат не открывается внутри хаба (блокировка iframe). Открой отдельной вкладкой — она уже в группе «Личный».</p>
      <a id="fallbackLink" href="http://10.0.0.1:8000/chat" target="_blank" rel="noopener">Открыть чат</a>
    </div>
  </main>
  <script>
    const frame = document.getElementById("frame");
    const fallback = document.getElementById("fallback");
    const fallbackLink = document.getElementById("fallbackLink");
    const chips = [...document.querySelectorAll(".chip[data-src]")];

    function show(src) {
      fallback.classList.remove("show");
      frame.style.display = "block";
      frame.src = src;
      fallbackLink.href = src;
      // если iframe не загрузится — через 4с покажем запасной выход
      clearTimeout(window.__fb);
      window.__fb = setTimeout(() => {
        try {
          // cross-origin: часто недоступен contentWindow.document — это ок
          void frame.contentWindow.location.href;
        } catch (_) {}
      }, 4000);
    }

    chips.forEach((b) => {
      b.onclick = () => {
        chips.forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        show(b.dataset.src);
      };
    });

    frame.addEventListener("error", () => {
      fallback.classList.add("show");
      frame.style.display = "none";
    });

    document.getElementById("openClaude").onclick = () => {
      window.open("https://claude.ai/chats", "_blank");
    };
    document.getElementById("openAll").onclick = () => {
      window.open("http://10.0.0.1:8000/chat", "_blank");
      window.open("/", "_blank");
      window.open("https://claude.ai/chats", "_blank");
    };
  </script>
</body>
</html>
